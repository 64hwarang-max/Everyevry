n\", \"{}\");\n            PutDataMapRequest r = PutDataMapRequest.create(\"/gj/conf\");\n            r.getDataMap().putString(\"json\", js);\n            r.getDataMap().putLong(\"t\", System.currentTimeMillis());\n            Wearable.getDataClient(getContext()).putDataItem(r.asPutDataRequest().setUrgent()).addOnCompleteListener(t -> {\n                if (t.isSuccessful()) call.resolve(); else call.reject(\"워치로 보내지 못했습니다\");\n            });\n        } catch (Exception e) {\n            call.reject(\"워치로 보내지 못했습니다: \" + e.getMessage());\n        }\n    }\n\n    @PluginMethod\n    public void drain(PluginCall call) {\n        SharedPreferences p = getContext().getSharedPreferences(\"wearq\", Context.MODE_PRIVATE);\n        String s = p.getString(\"q\", \"[]\");\n        p.edit().putString(\"q\", \"[]\").apply();\n        JSObject r = new JSObject();\n        r.put(\"json\", s);\n        call.resolve(r);\n    }\n\n    @PluginMethod\n    public void nodes(PluginCall call) {\n        try {\n            Wearable.getNodeClient(getContext()).getConnectedNodes().addOnCompleteListener(t -> {\n                JSObject r = new JSObject();\n                JSArray a = new JSArray();\n                if (t.isSuccessful() && t.getResult() != null) for (Node n : t.getResult()) a.put(n.getDisplayName());\n                r.put(\"nodes\", a);\n                call.resolve(r);\n            });\n        } catch (Exception e) {\n            JSObject r = new JSObject();\n            r.put(\"nodes\", new JSArray());\n            r.put(\"err\", String.valueOf(e.getMessage()));\n            call.resolve(r);\n        }\n    }\n\n    @PluginMethod\n    public void pull(PluginCall call) {\n        try {\n            Context c = getContext();\n            Wearable.getDataClient(c).getDataItems(Uri.parse(\"wear://*/gj/log\"), DataClient.FILTER_PREFIX).addOnCompleteListener(t -> {\n                int n = 0;\n                if (t.isSuccessful()) {\n                    DataItemBuffer b = t.getResult();\n                    for (DataItem it : b) {\n                        String js = DataMapItem.fromDataItem(it).getDataMap().getString(\"json\");\n                        if (js != null) { enqueue(c, js); n++; }\n                        try { Wearable.getDataClient(c).deleteDataItems(it.getUri()); } catch (Exception e) { /* 무시 */ }\n                    }\n                    b.release();\n                }\n                JSObject r = new JSObject();\n                r.put(\"n\", n);\n                call.resolve(r);\n            });\n        } catch (Exception e) {\n            JSObject r = new JSObject();\n            r.put(\"n\", 0);\n            call.resolve(r);\n        }\n    }\n}\n", "WearStore.java": "package __PKG__;\n\nimport android.content.Context;\nimport android.content.SharedPreferences;\nimport android.net.Uri;\nimport com.google.android.gms.wearable.DataItem;\nimport com.google.android.gms.wearable.DataItemBuffer;\nimport com.google.android.gms.wearable.DataMap;\nimport com.google.android.gms.wearable.DataMapItem;\nimport com.google.android.gms.wearable.PutDataMapRequest;\nimport com.google.android.gms.wearable.Wearable;\nimport org.json.JSONObject;\n\npublic class WearStore {\n    static SharedPreferences p(Context c) { return c.getSharedPreferences(\"gjw\", Context.MODE_PRIVATE); }\n\n    static JSONObject conf(Context c) {\n        try { return new JSONObject(p(c).getString(\"conf\", \"{}\")); } catch (Exception e) { return new JSONObject(); }\n    }\n\n    static void saveConf(Context c, String s) {\n        p(c).edit().putString(\"conf\", s).putLong(\"confAt\", System.currentTimeMillis()).apply();\n    }\n\n    static void send(Context c, JSONObject o) {\n        try {\n            long t = System.currentTimeMillis();\n            o.put(\"id\", \"w\" + t);\n            PutDataMapRequest r = PutDataMapRequest.create(\"/gj/log/\" + t);\n            r.getDataMap().putString(\"json\", o.toString());\n            r.getDataMap().putLong(\"t\", t);\n            Wearable.getDataClient(c).putDataItem(r.asPutDataRequest().setUrgent());\n            SharedPreferences sp = p(c);\n            sp.edit().putInt(\"sent\", sp.getInt(\"sent\", 0) + 1).putLong(\"lastSent\", t).apply();\n        } catch (Exception e) {\n            // 휴대폰과 연결되면 데이터 레이어가 나중에 보냅니다\n        }\n    }\n\n    static void pull(Context c, Runnable done) {\n        try {\n            Wearable.getDataClient(c).getDataItems(Uri.parse(\"wear://*/gj/conf\")).addOnCompleteListener(task -> {\n                try {\n                    if (task.isSuccessful()) {\n                        DataItemBuffer b = task.getResult();\n                        long best = -1;\n                        String js = null;\n                        for (DataItem it : b) {\n                            DataMap m = DataMapItem.fromDataItem(it).getDataMap();\n                            long t = m.getLong(\"t\", 0L);\n                            if (t > best) { best = t; js = m.getString(\"json\"); }\n                        }\n                        b.release();\n                        if (js != null) saveConf(c, js);\n                    }\n                } catch (Exception e) {\n                    // 무시\n                }\n                if (done != null) done.run();\n            });\n        } catch (Exception e) {\n            if (done != null) done.run();\n        }\n    }\n}\n", "WearLinkService.java": "package __PKG__;\n\nimport com.google.android.gms.wearable.DataEvent;\nimport com.google.android.gms.wearable.DataEventBuffer;\nimport com.google.android.gms.wearable.DataItem;\nimport com.google.android.gms.wearable.DataMapItem;\nimport com.google.android.gms.wearable.Wearable;\nimport com.google.android.gms.wearable.WearableListenerService;\n\npublic class WearLinkService extends WearableListenerService {\n    @Override\n    public void onDataChanged(DataEventBuffer events) {\n        boolean any = false;\n        for (DataEvent e : events) {\n            if (e.getType() != DataEvent.TYPE_CHANGED) continue;\n            DataItem it = e.getDataItem();\n            String path = it.getUri().getPath();\n            if (path == null || !path.startsWith(\"/gj/log\")) continue;\n            String js = DataMapItem.fromDataItem(it).getDataMap().getString(\"json\");\n            if (js != null) { WearLink.enqueue(this, js); any = true; }\n            try { Wearable.getDataClient(this).deleteDataItems(it.getUri()); } catch (Exception x) { /* 무시 */ }\n        }\n        if (any) WearLink.ping();\n    }\n}\n", "WearSync.java": "package __PKG__;\n\nimport com.google.android.gms.wearable.DataEvent;\nimport com.google.android.gms.wearable.DataEventBuffer;\nimport com.google.android.gms.wearable.DataItem;\nimport com.google.android.gms.wearable.DataMapItem;\nimport com.google.android.gms.wearable.WearableListenerService;\n\npublic class WearSync extends WearableListenerService {\n    @Override\n    public void onDataChanged(DataEventBuffer events) {\n        for (DataEvent e : events) {\n            if (e.getType() != DataEvent.TYPE_CHANGED) continue;\n            DataItem it = e.getDataItem();\n            if (!\"/gj/conf\".equals(it.getUri().getPath())) continue;\n            String js = DataMapItem.fromDataItem(it).getDataMap().getString(\"json\");\n            if (js != null) WearStore.saveConf(this, js);\n        }\n    }\n}\n", "WearRun.java": "package __PKG__;\n\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\nimport android.view.WindowManager;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\nimport android.widget.TextView;\n\npublic class WearRun extends Activity {\n    final Handler h = new Handler(Looper.getMainLooper());\n    TextView t1, t2, t3;\n    LinearLayout btns;\n    String lastMode = \"\";\n    final Runnable tick = new Runnable() {\n        public void run() { draw(); h.postDelayed(this, 500); }\n    };\n\n    @Override\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n        ScrollView sv = new ScrollView(this);\n        sv.setBackgroundColor(0xFF101522);\n        LinearLayout l = WearUi.column(this);\n        t1 = WearUi.tv(this, \"\", 12, 0xFFB0B8C8, false);\n        t2 = WearUi.tv(this, \"\", 18, 0xFFFFFFFF, true);\n        t3 = WearUi.tv(this, \"\", 34, 0xFFFFD166, true);\n        l.addView(t1); l.addView(t2); l.addView(t3);\n        btns = new LinearLayout(this);\n        btns.setOrientation(LinearLayout.VERTICAL);\n        l.addView(btns);\n        sv.addView(l);\n        setContentView(sv);\n    }\n\n    @Override\n    protected void onResume() { super.onResume(); lastMode = \"\"; h.post(tick); }\n\n    @Override\n    protected void onPause() { super.onPause(); h.removeCallbacks(tick); }\n\n    void draw() {\n        String ty = WearTimer.type;\n        if (ty == null) { finish(); return; }\n        boolean rate = \"rate\".equals(WearTimer.phase);\n        if (\"rt\".equals(ty)) t1.setText(\"🔁 \" + WearTimer.name + \" · \" + (WearTimer.idx + 1) + \"/\" + WearTimer.items.length());\n        else t1.setText(rate ? \"🎯 몰입 끝\" : \"🎯 몰입\");\n        t2.setText(WearTimer.curName());\n        if (rate) {\n            t3.setText(\"얼마나 집중했나요?\");\n            t3.setTextSize(15);\n            t3.setTextColor(0xFFFFFFFF);\n        } else {\n            long r = WearTimer.remain();\n            boolean over = r < 0;\n            long s = Math.abs(r) / 1000L;\n            t3.setText((over ? \"+\" : \"\") + (s / 60) + \":\" + String.format(\"%02d\", s % 60));\n            t3.setTextSize(34);\n            t3.setTextColor(over ? 0xFFFF6B6B : (WearTimer.paused ? 0xFF8899AA : 0xFFFFD166));\n        }\n        String mode = ty + \"|\" + WearTimer.phase + \"|\" + WearTimer.paused + \"|\" + WearTimer.idx;\n        if (mode.equals(lastMode)) return;\n        lastMode = mode;\n        btns.removeAllViews();\n        if (rate) {\n            int[] vs = {100, 80, 60, 40, 20};\n            for (int v : vs) {\n                final int q = v;\n                btns.addView(WearUi.btn(this, q + \"%\", 0xFF2E7D32, () -> WearTimer.rate(this, q)));\n            }\n        } else if (\"rt\".equals(ty)) {\n            boolean last = WearTimer.idx >= WearTimer.items.length() - 1;\n            btns.addView(WearUi.btn(this, last ? \"✓ 끝\" : \"✓ 다음\", 0xFF2E7D32, () -> WearTimer.next(this, false)));\n            btns.addView(WearUi.btn(this, WearTimer.paused ? \"▶ 계속\" : \"⏸ 멈춤\", 0xFF37474F, () -> { WearTimer.pause(); lastMode = \"\"; }));\n            btns.addView(WearUi.btn(this, \"⏭ 건너뛰기\", 0xFF37474F, () -> WearTimer.next(this, true)));\n            btns.addView(WearUi.btn(this, \"✕ 그만두기\", 0xFF5D4037, () -> { WearTimer.stop(this); finish(); }));\n        } else {\n            btns.addView(WearUi.btn(this, WearTimer.paused ? \"▶ 계속\" : \"⏸ 멈춤\", 0xFF37474F, () -> { WearTimer.pause(); lastMode = \"\"; }));\n            btns.addView(WearUi.btn(this, \"+5분\", 0xFF37474F, WearTimer::plus5));\n            btns.addView(WearUi.btn(this, \"■ 끝내기\", 0xFFC62828, WearTimer::finishFc));\n            btns.addView(WearUi.btn(this, \"✕ 기록 없이 그만\", 0xFF5D4037, () -> { WearTimer.stop(this); finish(); }));\n        }\n    }\n}\n", "WearUi.java": "package __PKG__;\n\nimport android.content.Context;\nimport android.graphics.Typeface;\nimport android.graphics.drawable.GradientDrawable;\nimport android.view.Gravity;\nimport android.widget.Button;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\n\npublic class WearUi {\n    static int dp(Context c, int v) { return Math.round(v * c.getResources().getDisplayMetrics().density); }\n\n    static TextView tv(Context c, String s, int sp, int color, boolean bold) {\n        TextView t = new TextView(c);\n        t.setText(s);\n        t.setTextSize(sp);\n        t.setTextColor(color);\n        t.setGravity(Gravity.CENTER);\n        if (bold) t.setTypeface(null, Typeface.BOLD);\n        LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);\n        lp.topMargin = dp(c, 4);\n        t.setLayoutParams(lp);\n        return t;\n    }\n\n    static Button btn(Context c, String s, int color, Runnable on) {\n        Button b = new Button(c);\n        b.setText(s);\n        b.setAllCaps(false);\n        b.setTextSize(14);\n        b.setTextColor(0xFFFFFFFF);\n        GradientDrawable g = new GradientDrawable();\n        g.setColor(color);\n        g.setCornerRadius(dp(c, 22));\n        b.setBackground(g);\n        b.setPadding(dp(c, 10), dp(c, 6), dp(c, 10), dp(c, 6));\n        LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(c, 46));\n        lp.topMargin = dp(c, 6);\n        b.setLayoutParams(lp);\n        b.setOnClickListener(v -> on.run());\n        return b;\n    }\n\n    static LinearLayout column(Context c) {\n        LinearLayout l = new LinearLayout(c);\n        l.setOrientation(LinearLayout.VERTICAL);\n        l.setGravity(Gravity.CENTER_HORIZONTAL);\n        int side = dp(c, 22);\n        l.setPadding(side, dp(c, 30), side, dp(c, 44));\n        return l;\n    }\n}\n"};
