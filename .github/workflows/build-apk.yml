          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "RecBridge")
          public class RecBridge extends Plugin {
              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences("note_rec", Context.MODE_PRIVATE);
              }

              @PluginMethod
              public void start(PluginCall call) {
                  JSObject r = new JSObject();
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      try {
                          ActivityCompat.requestPermissions(getActivity(), new String[] { Manifest.permission.RECORD_AUDIO }, 7731);
                      } catch (Exception e) {
                          // 권한 창을 띄우지 못함
                      }
                      r.put("perm", false);
                      r.put("ok", false);
                      call.resolve(r);
                      return;
                  }
                  if (RecService.running) {
                      r.put("perm", true);
                      r.put("ok", false);
                      r.put("busy", true);
                      call.resolve(r);
                      return;
                  }
                  String nid = call.getString("nid");
                  if (nid == null) nid = "";
                  File dir = new File(getContext().getFilesDir(), "noterec");
                  if (!dir.exists()) dir.mkdirs();
                  File f = new File(dir, "rec-" + System.currentTimeMillis() + ".m4a");
                  Intent i = new Intent(getContext(), RecService.class);
                  i.putExtra("path", f.getAbsolutePath());
                  i.putExtra("nid", nid); Integer br = call.getInt("br"); Integer sr = call.getInt("sr"); i.putExtra("br", br == null ? 24000 : br.intValue()); i.putExtra("sr", sr == null ? 16000 : sr.intValue());
                  try {
                      if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                      else getContext().startService(i);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                      return;
                  }
                  r.put("perm", true);
                  r.put("ok", true);
                  r.put("path", f.getAbsolutePath());
                  r.put("t0", System.currentTimeMillis());
                  call.resolve(r);
              }

              @PluginMethod
              public void status(PluginCall call) {
                  SharedPreferences p = prefs();
                  JSObject r = new JSObject();
                  r.put("on", RecService.running);
                  r.put("t0", RecService.running ? RecService.t0 : p.getLong("cur_t0", 0L));
                  r.put("path", RecService.running ? RecService.path : "");
                  r.put("nid", RecService.running ? RecService.nid : "");
                  r.put("err", p.getString("err", ""));
                  call.resolve(r);
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  try {
                      Intent i = new Intent(getContext(), RecService.class);
                      i.setAction("stop");
                      getContext().startService(i);
                  } catch (Exception e) {
                      // 이미 멈춤
                  }
                  call.resolve();
              }

              @PluginMethod
              public void pending(PluginCall call) {
                  JSObject r = new JSObject();
                  try {
                      JSONArray arr = new JSONArray(prefs().getString("pending", "[]"));
                      JSArray out = new JSArray();
                      for (int i = 0; i < arr.length(); i++) out.put(arr.getJSONObject(i));
                      r.put("items", out);
                  } catch (Exception e) {
                      r.put("items", new JSArray());
                  }
                  call.resolve(r);
              }

              @PluginMethod
              public void done(PluginCall call) {
                  String path = call.getString("path");
                  if (path == null) path = "";
                  try {
                      JSONArray arr = new JSONArray(prefs().getString("pending", "[]"));
                      JSONArray keep = new JSONArray();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          if (!path.equals(o.optString("path", ""))) keep.put(o);
                      }
                      prefs().edit().putString("pending", keep.toString()).apply();
                  } catch (Exception e) {
                      // 목록 정리 실패
                  }
                  try {
                      File f = new File(path);
                      if (path.length() > 0 && f.getAbsolutePath().contains("noterec")) f.delete();
                  } catch (Exception e) {
                      // 파일 정리 실패
                  }
                  call.resolve();
              }
          }
