          // 최종 APK에 들어간 부품 표시 (Actions 실행 화면 요약)
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const jd=path.join('android/app/src/main/java',...cfg.appId.split('.'));
          const has=f=>fs.existsSync(path.join(jd,f))?'✅':'❌ 빠짐';
          const ma=fs.readFileSync(path.join(jd,'MainActivity.java'),'utf8');
          const rows=[['오늘 위젯','WidgetBridge'],['달력 위젯','CalBridge'],['떠 있는 버튼','FloatBridge'],['몰입 잠금','FocusBridge'],['노트 녹음(화면 꺼도)','RecBridge'],['워치 알림','WatchBridge'],['헬스 커넥트','HealthBridge'],['구글 캘린더 (앱 내장)','GCalBridge'],['워치 단독 앱 연동','WearLink']];
          let out='## '+cfg.appName+' APK 부품 확인\n\n| 부품 | 파일 | 등록 |\n|---|---|---|\n';
          for(const [n,c] of rows)out+=`| ${n} | ${has(c+'.java')} | ${ma.includes('registerPlugin('+c+'.class)')?'✅':'❌'} |\n`;
          const sg=fs.existsSync('android/capacitor.settings.gradle')?fs.readFileSync('android/capacitor.settings.gradle','utf8'):'';
          for(const [n,k] of [['구글 캘린더 연동','capacitor-calendar'],['파일 저장·자동 백업','capacitor-filesystem'],['공유(카톡·드라이브로 보내기)','capacitor-share'],['알림','local-notifications'],['받아쓰기','speech-recognition'],['갤러리 저장','community-media']])out+=`| ${n} | npm | ${sg.includes(k)?'✅':'❌ 빠짐'} |\n`;
          out+='| 워치 앱 (워치에 따로 설치) | wear APK | '+(fs.existsSync('android/wear/build/outputs/apk/debug/wear-debug.apk')?'✅':'❌ 빠짐')+' |\n';
