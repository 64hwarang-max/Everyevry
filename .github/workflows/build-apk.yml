          const J={"WearTimer.java": "package __PKG__;\n\nimport android.app.Notification;\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.app.PendingIntent;\nimport android.app.Service;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.os.Build;\nimport android.os.Handler;\nimport android.os.IBinder;\nimport android.os.Looper;\nimport android.os.PowerManager;\nimport android.os.VibrationEffect;\nimport android.os.Vibrator;\nimport org.json.JSONArray;\nimport org.json.JSONObject;\n\npublic class WearTimer extends Service {\n    static String type = null; // \"rt\" 루틴 · \"fc\" 몰입\n    static String phase = \"\";  // run · rate\n    static String name = \"\", rid = \"\", act = \"\";\n    static JSONArray items = new JSONArray();\n    static int idx = 0, fcMin = 25;\n    static long itemStart, pausedAt, pauseAcc, sessStart, fcEnd;\n    static boolean paused = false, rang = false;\n    static long[] actual = new long[0];\n    static boolean[] skipped = new boolean[0];\n    static WearTimer live;\n\n    final Handler h = new Handler(Looper.getMainLooper());\n    PowerManager.WakeLock wl;\n    final Runnable tick = new Runnable() {\n        public void run() { step(); h.postDelayed(this, 1000); }\n    };\n\n    static long now() { return System.currentTimeMillis(); }\n    static long elapsed() { return Math.max(0L, (paused ? pausedAt : now()) - itemStart - pauseAcc); }\n    static long planMs() {\n        if (\"fc\".equals(type)) return fcMin * 60000L;\n        JSONObject it = items.optJSONObject(idx);\n        return (it == null ? 1 : Math.max(1, it.optInt(\"m\", 1))) * 60000L;\n    }\n    static long remain() { return planMs() - elapsed(); }\n    static String curName() {\n        if (\"fc\".equals(type)) return act;\n        JSONObject it = items.optJSONObject(idx);\n        return it == null ? \"\" : it.optString(\"n\", \"\");\n    }\n\n    static void startRoutine(Context c, JSONObject r) {\n        JSONArray a = r.optJSONArray(\"items\");\n        if (a == null || a.length() == 0) return;\n        type = \"rt\"; phase = \"run\"; rid = r.optString(\"id\"); name = r.optString(\"name\", \"루틴\"); items = a; idx = 0;\n        actual = new long[a.length()]; skipped = new boolean[a.length()];\n        sessStart = now(); itemStart = now(); paused = false; pauseAcc = 0; rang = false;\n        go(c);\n    }\n\n    static void startFocus(Context c, String a, int min) {\n        type = \"fc\"; phase = \"run\"; act = (a == null || a.length() == 0) ? \"집중\" : a; name = act; fcMin = Math.max(1, min);\n        sessStart = now(); itemStart = now(); paused = false; pauseAcc = 0; rang = false;\n        go(c);\n    }\n\n    static void go(Context c) {\n        Intent i = new Intent(c, WearTimer.class);\n        if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);\n        Intent r = new Intent(c, WearRun.class);\n        r.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n        c.startActivity(r);\n    }\n\n    static void pause() {\n        if (type == null || \"rate\".equals(phase)) return;\n        if (paused) { pauseAcc += now() - pausedAt; paused = false; } else { paused = true; pausedAt = now(); }\n        if (live != null) live.notif();\n    }\n\n    static void plus5() {\n        if (!\"fc\".equals(type) || \"rate\".equals(phase)) return;\n        fcMin += 5; rang = false;\n        if (live != null) live.notif();\n    }\n\n    static void next(Context c, boolean skip) {\n        if (!\"rt\".equals(type)) return;\n        actual[idx] = elapsed() / 1000L; skipped[idx] = skip;\n        idx++; itemStart = now(); paused = false; pauseAcc = 0; rang = false;\n        if (idx >= items.length()) finishRt(c);\n        else { vib(c, new long[]{0, 120}); if (live != null) live.notif(); }\n    }\n\n    static void finishFc() {\n        if (!\"fc\".equals(type) || \"rate\".equals(phase)) return;\n        fcEnd = paused ? pausedAt : now();\n        if (paused) { paused = false; }\n        phase = \"rate\";\n        if (live != null) live.notif();\n    }\n\n    static void rate(Context c, int q) {\n        if (!\"fc\".equals(type)) return;\n        try {\n            JSONObject o = new JSONObject();\n            o.put(\"k\", \"fc\"); o.put(\"act\", act); o.put(\"st\", sessStart); o.put(\"en\", fcEnd);\n            long ms = fcEnd - sessStart - pauseAcc;\n            o.put(\"min\", Math.max(1L, Math.round(ms / 60000.0)));\n            o.put(\"q\", q);\n            WearStore.send(c, o);\n        } catch (Exception e) {\n            // 무시\n        }\n        stop(c);\n    }\n\n    static void finishRt(Context c) {\n        try {\n            JSONObject o = new JSONObject();\n            o.put(\"k\", \"rt\"); o.put(\"rid\", rid); o.put(\"name\", name); o.put(\"st\", sessStart); o.put(\"en\", now());\n            JSONArray a = new JSONArray();\n            for (int i = 0; i < items.length(); i++) {\n                JSONObject it = items.optJSONObject(i);\n                JSONObject x = new JSONObject();\n                x.put(\"n\", it == null ? \"\" : it.optString(\"n\"));\n                x.put(\"p\", (it == null ? 1 : it.optInt(\"m\", 1)) * 60);\n                x.put(\"a\", actual[i]);\n                x.put(\"s\", skipped[i]);\n                a.put(x);\n            }\n            o.put(\"items\", a);\n            WearStore.send(c, o);\n        } catch (Exception e) {\n            // 무시\n        }\n        vib(c, new long[]{0, 300, 150, 300, 150, 300});\n        stop(c);\n    }\n\n    static void stop(Context c) {\n        type = null; phase = \"\";\n        c.stopService(new Intent(c, WearTimer.class));\n    }\n\n    static void vib(Context c, long[] pat) {\n        try {\n            Vibrator v = (Vibrator) c.getSystemService(Context.VIBRATOR_SERVICE);\n            if (v == null) return;\n            if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(pat, -1)); else v.vibrate(pat, -1);\n        } catch (Exception e) {\n            // 무시\n        }\n    }\n\n    void step() {\n        if (type == null) { stopSelf(); return; }\n        if (paused || \"rate\".equals(phase)) return;\n        if (!rang && remain() <= 0) {\n            rang = true;\n            vib(this, new long[]{0, 400, 200, 400, 200, 400});\n            if (\"fc\".equals(type)) {\n                finishFc();\n                Intent r = new Intent(this, WearRun.class);\n                r.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n                try { startActivity(r); } catch (Exception e) { /* 무시 */ }\n            } else {\n                notif();\n            }\n        }\n    }\n\n    @Override\n    public void onCreate() {\n        super.onCreate();\n        live = this;\n        try {\n            PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);\n            wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, \"gj:timer\");\n            wl.acquire(4L * 60 * 60 * 1000);\n        } catch (Exception e) {\n            // 무시\n        }\n    }\n\n    @Override\n    public int onStartCommand(Intent i, int flags, int startId) {\n        startForeground(7701, build());\n        h.removeCallbacks(tick);\n        h.post(tick);\n        return START_NOT_STICKY;\n    }\n\n    @Override\n    public void onDestroy() {\n        h.removeCallbacks(tick);\n        live = null;\n        try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { /* 무시 */ }\n        super.onDestroy();\n    }\n\n    @Override\n    public IBinder onBind(Intent i) { return null; }\n\n    void notif() {\n        try {\n            NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);\n            nm.notify(7701, build());\n        } catch (Exception e) {\n            // 무시\n        }\n    }\n\n    Notification build() {\n        String ch = \"gj_timer\";\n        NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);\n        if (Build.VERSION.SDK_INT >= 26 && nm != null && nm.getNotificationChannel(ch) == null) {\n            NotificationChannel c = new NotificationChannel(ch, \"실행 타이머\", NotificationManager.IMPORTANCE_LOW);\n            c.setSound(null, null);\n            nm.createNotificationChannel(c);\n        }\n        Intent r = new Intent(this, WearRun.class);\n        PendingIntent pi = PendingIntent.getActivity(this, 1, r, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);\n        Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);\n        b.setSmallIcon(R.drawable.ic_w)\n                .setContentTitle((\"rt\".equals(type) ? \"🔁 \" : \"🎯 \") + curName())\n                .setContentText(\"rate\".equals(phase) ? \"집중도를 눌러 기록하십시오\" : (paused ? \"멈춤\" : \"진행 중\"))\n                .setOngoing(true)\n                .setContentIntent(pi);\n        if (type != null && !paused && !\"rate\".equals(phase)) {\n            b.setWhen(now() + remain()).setShowWhen(true).setUsesChronometer(true);\n            if (Build.VERSION.SDK_INT >= 24) b.setChronometerCountDown(true);\n        }\n        return b.build();\n    }\n}\n", "WearMain.java": "package __PKG__;\n\nimport android.app.Activity;\nimport android.content.Intent;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\nimport java.text.SimpleDateFormat;\nimport java.util.Date;\nimport java.util.Locale;\nimport org.json.JSONArray;\nimport org.json.JSONObject;\n\npublic class WearMain extends Activity {\n    LinearLayout l;\n\n    @Override\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        ScrollView sv = new ScrollView(this);\n        sv.setBackgroundColor(0xFF101522);\n        l = WearUi.column(this);\n        sv.addView(l);\n        setContentView(sv);\n        if (Build.VERSION.SDK_INT >= 33) {\n            try { requestPermissions(new String[]{\"android.permission.POST_NOTIFICATIONS\"}, 1); } catch (Exception e) { /* 무시 */ }\n        }\n    }\n\n    @Override\n    protected void onResume() {\n        super.onResume();\n        draw();\n        WearStore.pull(this, () -> runOnUiThread(this::draw));\n    }\n\n    static int hm(String s) {\n        try { String[] p = s.split(\":\"); return Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]); } catch (Exception e) { return -1; }\n    }\n\n    void draw() {\n        l.removeAllViews();\n        JSONObject c = WearStore.conf(this);\n        l.addView(WearUi.tv(this, c.optString(\"app\", \"성장일지\"), 15, 0xFFFFFFFF, true));\n        if (WearTimer.type != null) {\n            l.addView(WearUi.btn(this, \"▶ 진행 중 · \" + WearTimer.curName(), 0xFFE07B00, () -> startActivity(new Intent(this, WearRun.class))));\n        }\n        String today = new SimpleDateFormat(\"yyyy-MM-dd\", Locale.KOREA).format(new Date());\n        JSONArray plan = c.optJSONArray(\"plan\");\n        if (plan != null && today.equals(c.optString(\"date\"))) {\n            int nowM = hm(new SimpleDateFormat(\"HH:mm\", Locale.KOREA).format(new Date()));\n            JSONObject cur = null, nxt = null;\n            for (int i = 0; i < plan.length(); i++) {\n                JSONObject p = plan.optJSONObject(i);\n                if (p == null) continue;\n                int s = hm(p.optString(\"s\")), e = hm(p.optString(\"e\"));\n                if (s < 0 || e < 0) continue;\n                if (s <= nowM && nowM < e && cur == null) cur = p;\n                if (s > nowM && nxt == null) nxt = p;\n            }\n            if (cur != null) {\n                final String a = cur.optString(\"act\", \"계획\");\n                final int left = Math.max(5, hm(cur.optString(\"e\")) - nowM);\n                l.addView(WearUi.tv(this, \"지금 · \" + cur.optString(\"s\") + \"~\" + cur.optString(\"e\"), 11, 0xFFB0B8C8, false));\n                l.addView(WearUi.btn(this, \"🎯 \" + a + \" (\" + left + \"분)\",