        run: |
          cat > add-watch.js <<'WXJ'
          // 워치 연동: ① 워치에서 누를 수 있는 알림(집중 타이머·우선순위·말로 적기) ② 헬스 커넥트에서 수면·운동·체중 읽기
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId;
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          const W=(f,s)=>fs.writeFileSync(path.join(javaDir,f),s.replace(/__PKG__/g,pkg));

          W('WatchBridge.java',`package __PKG__;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.app.RemoteInput;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "WatchBridge")
          public class WatchBridge extends Plugin {
              static final String CH = "watch_link";
              static final String CH_QUIET = "watch_link_quiet";
              static WatchBridge live;

              @Override
              public void load() {
                  live = this;
              }

              static void channels(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (nm.getNotificationChannel(CH) == null) {
                      NotificationChannel a = new NotificationChannel(CH, "워치 연동", NotificationManager.IMPORTANCE_DEFAULT);
                      a.setDescription("집중 타이머·우선순위·말로 적기를 워치에서 누를 수 있게 보냅니다");
                      a.setSound(null, null);
                      nm.createNotificationChannel(a);
                  }
                  if (nm.getNotificationChannel(CH_QUIET) == null) {
                      NotificationChannel b = new NotificationChannel(CH_QUIET, "워치 연동 (조용히)", NotificationManager.IMPORTANCE_LOW);
                      b.setDescription("이미 보낸 알림의 내용만 조용히 고칩니다");
                      b.setSound(null, null);
                      b.enableVibration(false);
                      nm.createNotificationChannel(b);
                  }
              }

              static int flags(boolean mutable) {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 31) f |= mutable ? PendingIntent.FLAG_MUTABLE : PendingIntent.FLAG_IMMUTABLE;
                  else if (Build.VERSION.SDK_INT >= 23 && !mutable) f |= PendingIntent.FLAG_IMMUTABLE;
                  return f;
              }

              static void post(Context c, JSONObject o) {
                  channels(c);
                  int id = o.optInt("id", 9700);
                  String kind = o.optString("kind", "");
                  boolean silent = o.optBoolean("silent", true);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, silent ? CH_QUIET : CH)
                          .setSmallIcon(c.getApplicationInfo().icon)
                          .setContentTitle(o.optString("title", ""))
                          .setContentText(o.optString("text", ""))
                          .setOnlyAlertOnce(true)
                          .setAutoCancel(false)
                          .setCategory(NotificationCompat.CATEGORY_REMINDER)
                          .setPriority(silent ? NotificationCompat.PRIORITY_LOW : NotificationCompat.PRIORITY_DEFAULT);
                  if (silent) b.setSilent(true);
                  JSONArray lines = o.optJSONArray("lines");
                  if (lines != null && lines.length() > 0) {
                      NotificationCompat.InboxStyle st = new NotificationCompat.InboxStyle();
                      for (int i = 0; i < lines.length(); i++) st.addLine(lines.optString(i));
                      st.setSummaryText(o.optString("text", ""));
                      b.setStyle(st);
                  } else if (o.optString("big", "").length() > 0) {
                      b.setStyle(new NotificationCompat.BigTextStyle().bigText(o.optString("big")));
                  }
                  long when = o.optLong("chrono", 0L);
                  if (when > 0L) {
                      b.setWhen(when).setShowWhen(true).setUsesChronometer(true);
                      if (Build.VERSION.SDK_INT >= 24) b.setChronometerCountDown(o.optBoolean("down", true));
                  }
                  Intent open = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
