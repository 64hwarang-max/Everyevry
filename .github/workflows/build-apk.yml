          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "FocusBridge")
          public class FocusBridge extends Plugin {
              private static int prevFilter = -1;

              private NotificationManager nm() {
                  return (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
              }

              private boolean granted() {
                  return Build.VERSION.SDK_INT < 23 || nm().isNotificationPolicyAccessGranted();
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("dnd", granted());
                  r.put("dndOn", prevFilter != -1);
                  call.resolve(r);
              }

              @PluginMethod
              public void askDnd(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 23) {
                      Intent i = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void setDnd(PluginCall call) {
                  Boolean on = call.getBoolean("on", false);
                  JSObject r = new JSObject();
                  if (Build.VERSION.SDK_INT < 23 || !granted()) {
                      r.put("ok", false);
                      call.resolve(r);
                      return;
                  }
                  try {
                      NotificationManager n = nm();
                      if (on != null && on) {
                          if (prevFilter == -1) prevFilter = n.getCurrentInterruptionFilter();
                          n.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY);
                      } else if (prevFilter != -1) {
                          n.setInterruptionFilter(prevFilter <= 0 ? NotificationManager.INTERRUPTION_FILTER_ALL : prevFilter);
                          prevFilter = -1;
                      }
                      r.put("ok", true);
                  } catch (Exception e) {
                      r.put("ok", false);
                  }
                  call.resolve(r);
              }

              @PluginMethod
              public void shareFile(PluginCall call) {
                  String name = call.getString("name", "");
                  String mime = call.getString("mime", "application/octet-stream");
                  String title = call.getString("title", "보내기");
                  try {
                      File f = new File(new File(getContext().getCacheDir(), "share"), name);
                      Uri u = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".calwidget", f);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(mime);
                      i.putExtra(Intent.EXTRA_STREAM, u);
                      i.putExtra(Intent.EXTRA_SUBJECT, name);
                      i.setClipData(ClipData.newRawUri(name, u));
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent ch = Intent.createChooser(i, title);
                      ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getContext().startActivity(ch);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void pin(PluginCall call) {
                  final Boolean on = call.getBoolean("on", false);
                  final Activity a = getActivity();
                  if (a == null) { call.resolve(); return; }
                  a.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (on != null && on) {
                                  a.startLockTask();
                                  a.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              } else {
                                  a.stopLockTask();
                                  a.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              }
                          } catch (Exception e) {
                              // 무시
                          }
                      }
                  });
                  call.resolve();
              }
          }
          `);
